[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js Runtime handles SSR/ISR/API routes automatically on Netlify
# Ensure @netlify/plugin-nextjs is installed in Netlify dashboard (auto-injected for Next.js)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API — no cache
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# Redirects for SPA fallback (not needed for Next.js, but safe)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[functions]
  # Increase timeout for upload signing (Netlify default 10s, pro can bump to 26s)
  directory = "netlify/functions"
  node_bundler = "esbuild"
